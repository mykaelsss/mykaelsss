name: Generate profile cards

on:
  schedule:
    # 05:00 UTC is 1:00 in New York, after the local day has closed
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile.yml
      - profile_v7.svg
      - scripts/render_profile.py
      - scripts/render_track.py

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISHED_URL: https://raw.githubusercontent.com/${{ github.repository }}/output
    steps:
      - uses: actions/checkout@v4

      # A failure here fails the job before publishing, so the output branch
      # keeps yesterday's cards rather than losing the hero card.
      # PROFILE_STATS_TOKEN is a read-only fine-grained token so the commit and
      # PR counts include private repos; GITHUB_TOKEN only sees public ones.
      - name: Render hero card
        run: python3 scripts/render_profile.py "${{ github.repository_owner }}" dist/profile.svg
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}

      # The car artwork is licensed stock that must never be published as a
      # file, so it lives in a secret and only display-size rasters of it end
      # up in the card. Publishing replaces the whole output branch, so when the
      # F1 APIs are down the last good card is carried over instead of dropped.
      - name: Render race track
        env:
          CAR_SVG: ${{ secrets.TRACK_CAR_SVG }}
        run: |
          render() {
            sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin >/dev/null &&
              printf '%s' "$CAR_SVG" > "$RUNNER_TEMP/car.svg" &&
              python3 scripts/render_track.py --car "$RUNNER_TEMP/car.svg" --output dist/track.svg
          }

          if render; then
            exit 0
          fi
          if curl -fsSL --retry 3 --max-time 30 "$PUBLISHED_URL/track.svg" -o dist/track.svg && grep -q 'id="lap"' dist/track.svg; then
            echo "::warning::Race track render failed, republishing the last good card"
          else
            echo "::error::Race track render failed and no previously published card to fall back on"
            exit 1
          fi

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
